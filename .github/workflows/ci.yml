name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs node, pnpm and actionlint at the versions mise.toml pins, so
      # that file is the one place those versions are written.
      - name: Install the toolchain from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      # pnpm-workspace.yaml's minimumReleaseAge and trustPolicy are checked
      # against every lockfile entry here, not only at resolution time.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Build packages
        run: pnpm build:packages

      # Packages type-check against each other's dist, so this runs after the
      # build above.
      - name: Format, lint and type check
        run: pnpm check

      - name: Run tests
        run: pnpm test:only

      - name: Check published package metadata (publint / attw)
        run: pnpm lint:packages

      - name: Build docs
        run: pnpm --filter @digital-agency-icons/docs build
